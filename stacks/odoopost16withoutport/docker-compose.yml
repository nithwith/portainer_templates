services:
  db:
    container_name: "${PROJECT_NAME}_db"
    image: postgres:15-bullseye
    restart: unless-stopped

    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U odoo -d odoo
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

    labels:
      - "traefik.enable=false"

  odoo:
    container_name: "${PROJECT_NAME}_odoo"
    image: "nithwith/odoo:${ODOO_VERSION}"
    restart: unless-stopped
    stop_grace_period: 60s

    depends_on:
      db:
        condition: service_healthy

    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      ODOO_RC: /etc/odoo/myodoo.conf

    command:
      - odoo
      - --config=/etc/odoo/myodoo.conf
      - --database=odoo
      - --init=base
      - --load-language=fr_FR
      - --without-demo=all
      - --no-database-list

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      # Filestore géré automatiquement par Docker
      - odoo-data:/var/lib/odoo

      # Configuration commune à toutes les instances de cette version
      - "/home/docker/odoo_config/${ODOO_VERSION}/myodoo.conf:/etc/odoo/myodoo.conf:ro"

      # Modules spécifiques à l'instance
      - "/home/docker/${PROJECT_NAME}/addons:/mnt/addons"

      # Dépôts OCA communs
      - "/home/docker/odoo_addons_community/${ODOO_VERSION}:/mnt/addons_community:ro"

    networks:
      - backend
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # HTTP
      - "traefik.http.routers.${PROJECT_NAME}-http.rule=Host(`${PROJECT_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${PROJECT_NAME}-http.service=${PROJECT_NAME}-http"
      - "traefik.http.services.${PROJECT_NAME}-http.loadbalancer.server.port=8069"

      # HTTPS
      - "traefik.http.routers.${PROJECT_NAME}-websecure.rule=Host(`${PROJECT_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}-websecure.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-websecure.service=${PROJECT_NAME}-websecure"
      - "traefik.http.routers.${PROJECT_NAME}-websecure.middlewares=${PROJECT_NAME}-gzip,${PROJECT_NAME}-sslheader"
      - "traefik.http.services.${PROJECT_NAME}-websecure.loadbalancer.server.port=8069"

      # WebSocket Odoo 18
      - "traefik.http.routers.${PROJECT_NAME}-websocket.rule=Host(`${PROJECT_URL}`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.priority=100"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.service=${PROJECT_NAME}-websocket"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.middlewares=${PROJECT_NAME}-gzip,${PROJECT_NAME}-sslheader"
      - "traefik.http.services.${PROJECT_NAME}-websocket.loadbalancer.server.port=8072"

      # Middlewares propres à l'instance
      - "traefik.http.middlewares.${PROJECT_NAME}-gzip.compress=true"
      - "traefik.http.middlewares.${PROJECT_NAME}-sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"

volumes:
  db-data:
  odoo-data:

networks:
  backend:
    internal: true

  proxy:
    external: true
    name: proxy