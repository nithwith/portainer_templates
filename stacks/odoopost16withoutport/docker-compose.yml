version: "3.8"

services:
  db:
    container_name: "${PROJECT_NAME}_db"
    image: postgres:15-bullseye
    restart: unless-stopped

    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U odoo -d odoo
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

    labels:
      - "traefik.enable=false"

  odoo:
    container_name: "${PROJECT_NAME}_odoo"
    image: "nithwith/odoo:${ODOO_VERSION}"
    restart: unless-stopped
    stop_grace_period: 60s

    depends_on:
      db:
        condition: service_healthy

    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      ODOO_RC: /etc/odoo/myodoo.conf

    command:
      - odoo
      - --config=/etc/odoo/myodoo.conf

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      # Filestore dédié à cette instance
      - odoo-data:/var/lib/odoo

      # Configuration Odoo partagée par version
      - "/home/docker/odoo_config/${ODOO_VERSION}/myodoo.conf:/etc/odoo/myodoo.conf:ro"

      # Addons spécifiques à cette instance
      - "/home/docker/${PROJECT_NAME}/addons:/mnt/addons:ro"

      # Dépôts OCA partagés
      - "/home/docker/odoo_addons_community/${ODOO_VERSION}:/mnt/addons_community:ro"

    networks:
      - backend
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Odoo principal en HTTPS
      - "traefik.http.routers.${PROJECT_NAME}-https.rule=Host(`${PROJECT_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}-https.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-https.tls=true"
      - "traefik.http.routers.${PROJECT_NAME}-https.service=${PROJECT_NAME}-odoo"
      - "traefik.http.routers.${PROJECT_NAME}-https.middlewares=${PROJECT_NAME}-compress"

      - "traefik.http.services.${PROJECT_NAME}-odoo.loadbalancer.server.port=8069"

      # WebSocket / bus Odoo
      - "traefik.http.routers.${PROJECT_NAME}-websocket.rule=Host(`${PROJECT_URL}`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.tls=true"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.priority=100"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.service=${PROJECT_NAME}-websocket"

      - "traefik.http.services.${PROJECT_NAME}-websocket.loadbalancer.server.port=8072"

      # Compression
      - "traefik.http.middlewares.${PROJECT_NAME}-compress.compress=true"

volumes:
  db-data:
    name: "${PROJECT_NAME}_db_data"

  odoo-data:
    name: "${PROJECT_NAME}_odoo_data"

networks:
  backend:
    internal: true

  proxy:
    external: true
    name: proxy