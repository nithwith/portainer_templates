services:
  odoo:
    container_name: "${PROJECT_NAME}_odoo"
    image: "nithwith/odoo:${ODOO_VERSION}"
    restart: unless-stopped

    depends_on:
      - db

    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo

    command:
      - odoo
      - -d odoo
      - -c /etc/odoo/myodoo.conf
      - --http-port=8069
      - --gevent-port=8072
      - --proxy-mode
      - --load-language=fr_FR
      - --language=fr_FR
      - --without-demo=all

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - "/home/docker/${PROJECT_NAME}/filestore:/var/lib/odoo"
      - "/home/docker/${PROJECT_NAME}/addons:/mnt/addons"
      - "/home/docker/odoo_addons_community/${ODOO_VERSION}:/mnt/addons_community"

    networks:
      - backend
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Redirection HTTP vers HTTPS
      - "traefik.http.routers.${PROJECT_NAME}-http.rule=Host(`${PROJECT_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${PROJECT_NAME}-http.middlewares=${PROJECT_NAME}-redirect-https"
      - "traefik.http.routers.${PROJECT_NAME}-http.service=${PROJECT_NAME}-odoo"

      - "traefik.http.middlewares.${PROJECT_NAME}-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${PROJECT_NAME}-redirect-https.redirectscheme.permanent=true"

      # Interface principale Odoo
      - "traefik.http.routers.${PROJECT_NAME}-https.rule=Host(`${PROJECT_URL}`)"
      - "traefik.http.routers.${PROJECT_NAME}-https.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-https.tls=true"
      - "traefik.http.routers.${PROJECT_NAME}-https.service=${PROJECT_NAME}-odoo"
      - "traefik.http.routers.${PROJECT_NAME}-https.middlewares=${PROJECT_NAME}-compress"

      - "traefik.http.services.${PROJECT_NAME}-odoo.loadbalancer.server.port=8069"

      # WebSocket / bus Odoo
      - "traefik.http.routers.${PROJECT_NAME}-websocket.rule=Host(`${PROJECT_URL}`) && PathPrefix(`/websocket`)"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.tls=true"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.priority=100"
      - "traefik.http.routers.${PROJECT_NAME}-websocket.service=${PROJECT_NAME}-websocket"

      - "traefik.http.services.${PROJECT_NAME}-websocket.loadbalancer.server.port=8072"

      # Compression HTTP
      - "traefik.http.middlewares.${PROJECT_NAME}-compress.compress=true"

  db:
    container_name: "${PROJECT_NAME}_db"
    image: postgres:15-bullseye
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - odoo-db-data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U odoo -d postgres
      interval: 10s
      timeout: 5s
      retries: 10

    labels:
      - "traefik.enable=false"

volumes:
  odoo-db-data:

networks:
  backend:
    internal: true

  proxy:
    external: true
    name: proxy